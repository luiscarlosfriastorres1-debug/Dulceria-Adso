<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/IndexDulceria/IconosHeader/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="encabezado">
        <div class="contenedorlogoheader">
            <a href="/IndexDulceria/Code/index.html"><img src="\IndexDulceria\IconosHeader\logo.png" alt="Logo no cargado" class="logoheader"></a>
        </div>
        <div class="nav-header">
            <span>Preferenciales</span>
            <span>Quienes Somos</span>
            <span>Pedidos</span>
        </div>
        <div class="iconosheader">
            <img src="/IndexDulceria/IconosHeader/user.png" alt="" class="iconuser">
            <img src="/IndexDulceria/IconosHeader/carrito.png" alt="" class="iconcarrito">
        </div>
    </header>

    <div class="login-contenedor">

        <div class="lado-izquierdo">
            <img src="/Login/Imagenes/img.png" alt="" class="img-login">
        </div>

        <div class="lado-derecho">
            <h2 class="titulo-login">Iniciar sesión</h2>

            <div class="campo">
                <img src="/Login/Imagenes/User Male.png" alt="" class="icono-campo">
                <input type="text" placeholder="Usuario">
            </div>

            <div class="campo">
                <img src="/Login/Imagenes/Lock.png" alt="" class="icono-campo">
                <input type="password" placeholder="Contraseña">
            </div>

            <button class="btn-ingresar">Ingresar</button>
            <button class="btn-registrate">Regístrate</button>

            <p class="link-login">¿No tienes cuenta?</p>
            <p class="link-login">¿Olvidaste tu contraseña?</p>
        </div>

    </div>

</body>
</html>
